Groups:
  - name: Immutable
    order: 1
    params:
      - name: region
        default: us-east1
        type: string
        regex: ^[a-z]+-[a-z]+\d+$
        description: GCP region where the rack will be deployed. See
          (GCP regions)[https://cloud.google.com/about/locations] for available options.
  - name: Storage
    order: 3
    params:
      - name: filestore_enable
        default: "false"
        type: boolean
        description: Enable Google Cloud Filestore NFS volumes for shared persistent
          storage across service replicas. Enables the GKE Filestore CSI driver and
          creates an NFS StorageClass.
  - name: Security & Compliance
    order: 2
    params:
      - name: cert_duration
        default: 2160h
        type: string
        regex: ^\d+h$
        description: Certificate renewal period. The default is 90 days (2160h).
      - name: docker_hub_username
        default: "null"
        sideNote: Not set by default
        optional: true
        type: string
        description: Docker Hub username for authenticated image pulls. Must be paired
          with &i docker_hub_password &i to avoid Docker Hub rate limits.
      - name: docker_hub_password
        default: "null"
        sideNote: Not set by default
        optional: true
        type: string
        description: Docker Hub access token for authenticated image pulls. Must be
          paired with &i docker_hub_username &i. Use a read-only access token rather
          than your account password.
  - name: Performance & Scaling
    order: 4
    params:
      - name: node_type
        default: n1-standard-2
        type: string
        regex: ^[a-z][a-z0-9]+-[a-z0-9-]+$
        description: GCP (machine type)[https://cloud.google.com/compute/docs/machine-resource]
          used for cluster nodes.
      - name: node_disk
        default: "100"
        type: integer
        description: Node disk size in GB
        allowedMinValue: 10
      - name: preemptible
        default: "true"
        type: boolean
        description: Use (preemptible)[https://cloud.google.com/compute/docs/instances/preemptible]
          instances for cost savings. Preemptible instances can be terminated by
          Google Cloud with short notice.
      - name: additional_node_groups_config
        default: "null"
        sideNote: Not configured by default
        optional: true
        type: string
        description: "&b Advanced Configuration &b &l Most users leave this off. It adds extra node pools tuned for specific workloads, such as larger machine types, more disk, GPU pools, or single-host Cloud TPU pools. &l &l Accepts a JSON array, base64-encoded JSON, or a path to a .json file. See the full (documentation)[https://docs.convox.com/configuration/rack-parameters/gcp/additional_node_groups_config/] for the format. &l &l GCP racks use regional clusters, so the min_size and max_size counts apply per zone rather than as cluster totals. &l"
  - name: Logging & Monitoring
    order: 5
    params:
      - name: syslog
        default: "null"
        sideNote: Not forwarded by default
        type: string
        regex: ^(tcp|udp|tcp\+tls)://[a-zA-Z\d._-]+(:\d+)?$
        description: Forward logs to a syslog endpoint  &l &i e.g. &i - tcp+tls://example.org:1234 &l
        optional: true
      - name: syslog_tls_verify
        default: "true"
        type: boolean
        description: "Checks the certificate of a tcp+tls syslog endpoint against the public certificate authorities trusted by the log forwarder. Turn it off for an endpoint with a self-signed or private certificate."
        sideNote: "Only applies to tcp+tls syslog endpoints."
      - name: router_log_redact_params
        default: "null"
        sideNote: Router logs are not masked if not set
        optional: true
        type: string
        regex: ^(all|[A-Za-z0-9_.-]+(,[A-Za-z0-9_.-]+)*)$
        description: "Masks query parameter values in router access and error logs before the logs are stored or forwarded. &l &l Set &b all &b to mask every value, or a comma-separated list of parameter names, such as &i reset_password_token,token,api_key &i, to mask only those. Names match in any case. A masked value reads FILTERED; the parameter name is kept. &l"
      - name: fluentd_memory
        default: 200Mi
        type: string
        regex: ^[1-9][0-9]*(Mi|Gi)$
        description: Memory request and limit for the Fluentd DaemonSet. Increase
          if Fluentd pods are experiencing OOMKills. From 3.25.11 Fluentd also sizes
          its buffers from this value, so a larger value holds more logs while
          Elasticsearch is slow or unreachable.
      - name: elasticsearch_disk
        default: 5Gi
        type: string
        regex: ^([5-9]|[1-9][0-9]+)Gi$
        description: Size of each Elasticsearch log volume in Kubernetes volume format, at
          least 5Gi &l &i e.g. &i - 5Gi, 20Gi &l The volumes can grow but not shrink. When a
          volume passes 80% full, the oldest logs are deleted.
      - name: gpu_observability_enable
        default: "false"
        type: boolean
        description: "Installs the NVIDIA DCGM exporter, which collects GPU telemetry from the NVIDIA GPU nodes in your rack. &l Metrics are served on port 9400 through a dcgm-exporter service in the kube-system namespace and are also advertised with prometheus.io pod annotations. &l &l Convox does not install a Prometheus on GCP, so point a Prometheus you run yourself at the exporter to collect the metrics. &l"
        sideNote: "Only has an effect when your rack includes NVIDIA GPU machines."
      - name: gpu_observability_chart_version
        default: "null"
        type: string
        description: "Version of the NVIDIA GPU metrics collector (the DCGM exporter) that Convox installs. Leave empty to use the version that ships with the Rack release; set it only to match a specific GPU driver."
        sideNote: "Only takes effect when GPU metrics collection is enabled."
      - name: dcgm_scrape_interval
        default: 15s
        type: string
        description: "How often you want the DCGM exporter scraped. The value is published as a scrape interval annotation on the exporter pods for your own Prometheus configuration to read; it does not change anything on its own. &l Accepts a duration from &i 15s &i to &i 300s &i. &l"
        sideNote: "Only takes effect when GPU metrics collection is enabled."
  - name: Cost & Budget
    order: 7
    params:
      - name: cost_tracking_enable
        default: "false"
        type: boolean
        description: |
          Enables the rack-side cost accumulator that attributes estimated
          Compute Engine spend to each app and enforces per-app monthly
          budget caps configured via &i convox budget set &i. &l &l Off by
          default, existing users see no change until opted in.
      - name: cost_tracking_history_days
        default: "62"
        type: integer
        description: "Days of daily per-app cost history the rack keeps for date-range queries in &i convox cost &i and the Console. Lowering it drops older days on the next write; raising it keeps more from then on."
        sideNote: "Only used when cost_tracking_enable is true."
        allowedMinValue: 31
        allowedMaxValue: 400
