balancers:
  alpha:
    whitelist: 1.1.1.1
  bravo:
    ports:
      3000: 3001
    service: nosuch
  charlie:
    annotations:
      - noequalssign
    ports:
      3000:
        protocol: sctp
        port: 3001
    service: serviceF
  delta:
    awsLoadBalancerController: true
    ports:
      6000:
        protocol: udp
        port: 6001
    service: serviceF
  echo:
    awsLoadBalancerController: true
    ports:
      53: 5300
      53:
        protocol: UDP
        port: 5300
    service: serviceF
resources:
  1resource:
    type: postgres
services:
  deployment-invalid-low:
    deployment:
      minimum: -1
      maximum: 99
  deployment-invalid-high:
    deployment:
      minimum: 101
      maximum: 201
  internal-router-invalid:
    internal: true
    internalRouter: true
  serviceF:
    build: .
    resources:
      - foo
  grpc-path-invalid:
    build: .
    port: grpc:50051
    grpcHealthEnabled: true
    health:
      grpcService: /ready
timers:
  timer_1:
    service: someservice
    schedule: "0 * * * ?"
