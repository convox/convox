name: release
on:
  push:
    tags: ["*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: golang-1.26
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - name: Install libudev-dev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git log --pretty="* %s" ..."$(git describe --abbrev=0 HEAD~)" > /tmp/changelog.txt
          cat /tmp/changelog.txt
          gh release create "${VERSION}" --prerelease --title "${VERSION}" --notes-file /tmp/changelog.txt
      - name: tools
        run: make tools
      - name: cli
        run: make -C cmd/convox build
        env:
          IMAGE: ${{ github.repository }}
      - name: upload-convox-linux-amd64
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: convox-linux-amd64
          path: ./cmd/convox/pkg/convox-linux-amd64
      - name: upload-convox-linux-arm64
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: convox-linux-arm64
          path: ./cmd/convox/pkg/convox-linux-arm64
      - name: upload-convox-darwin-amd64
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: convox-darwin-amd64
          path: ./cmd/convox/pkg/convox-darwin-amd64
      - name: upload-convox-darwin-arm64
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: convox-darwin-arm64
          path: ./cmd/convox/pkg/convox-darwin-arm64
  build-amd64:
    needs: release
    timeout-minutes: 45
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: login
        run: printf '%s' "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      - name: Install libudev-dev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: build-amd64
        run: docker buildx build --platform linux/amd64 -t "${GITHUB_REPOSITORY}:${VERSION}" --push --pull .
      - name: buildkit-amd64
        run: docker buildx build -f Dockerfile.buildkit --target rootless --platform linux/amd64 -t "${GITHUB_REPOSITORY}:${VERSION}-build" --push --pull .
      - name: buildkit-amd64-privileged
        run: docker buildx build -f Dockerfile.buildkit --target privileged --platform linux/amd64 -t "${GITHUB_REPOSITORY}:${VERSION}-build-privileged" --push --pull .
  build-arm64:
    needs: release
    timeout-minutes: 45
    runs-on: ubuntu-22.04-arm
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: login
        run: printf '%s' "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      - name: Install libudev-dev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: build-arm64
        run: docker buildx build --platform linux/arm64 -t "${GITHUB_REPOSITORY}:${VERSION}-arm64" --push --pull --build-arg DOCKER_ARCH=aarch64 --build-arg KUBECTL_ARCH=arm64 .
      - name: buildkit-arm64
        run: docker buildx build -f Dockerfile.buildkit --target rootless --platform linux/arm64 -t "${GITHUB_REPOSITORY}:${VERSION}-arm64-build" --push --pull .
      - name: buildkit-arm64-privileged
        run: docker buildx build -f Dockerfile.buildkit --target privileged --platform linux/arm64 -t "${GITHUB_REPOSITORY}:${VERSION}-arm64-build-privileged" --push --pull .

  create-manifests:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - name: login
        run: printf '%s' "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      - name: create multi-arch manifest for main image
        run: |
          docker buildx imagetools create \
            -t "${GITHUB_REPOSITORY}:${VERSION}" \
            "${GITHUB_REPOSITORY}:${VERSION}" \
            "${GITHUB_REPOSITORY}:${VERSION}-arm64"
      - name: create multi-arch manifest for buildkit rootless
        run: |
          docker buildx imagetools create \
            -t "${GITHUB_REPOSITORY}:${VERSION}-build" \
            "${GITHUB_REPOSITORY}:${VERSION}-build" \
            "${GITHUB_REPOSITORY}:${VERSION}-arm64-build"
      - name: create multi-arch manifest for buildkit privileged
        run: |
          docker buildx imagetools create \
            -t "${GITHUB_REPOSITORY}:${VERSION}-build-privileged" \
            "${GITHUB_REPOSITORY}:${VERSION}-build-privileged" \
            "${GITHUB_REPOSITORY}:${VERSION}-arm64-build-privileged"

  release-cli-linux:
    needs:
      - release
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: convox-linux-amd64
      - name: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - name: release
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          mv ./convox-linux-amd64 ./convox-linux
          gh release upload "${VERSION}" ./convox-linux --clobber
  release-cli-linux-arm64:
    needs:
      - release
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: convox-linux-arm64
      - name: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - name: release
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: gh release upload "${VERSION}" ./convox-linux-arm64 --clobber
  release-cli-macos:
    needs:
      - release
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: convox-darwin-amd64
      - name: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - name: release
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          mv ./convox-darwin-amd64 ./convox-macos
          gh release upload "${VERSION}" ./convox-macos --clobber
  release-cli-macos-arm64:
    needs:
      - release
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: convox-darwin-arm64
      - name: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - name: release
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          mv ./convox-darwin-arm64 ./convox-macos-arm64
          gh release upload "${VERSION}" ./convox-macos-arm64 --clobber
  e2e:
    if: github.repository == 'convox/convox' && !contains(github.ref_name, 'rc')
    needs:
      - create-manifests
      - release-cli-linux
      - release-cli-linux-arm64
      - release-cli-macos
      - release-cli-macos-arm64
    uses: ./.github/workflows/e2e.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
    with:
      version: ${{ github.ref_name }}
    secrets:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_REGION: ${{ secrets.ARM_REGION }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DIGITALOCEAN_ACCESS_ID: ${{ secrets.DIGITALOCEAN_ACCESS_ID }}
      DIGITALOCEAN_REGION: ${{ secrets.DIGITALOCEAN_REGION }}
      DIGITALOCEAN_SECRET_KEY: ${{ secrets.DIGITALOCEAN_SECRET_KEY }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
      GOOGLE_REGION: ${{ secrets.GOOGLE_REGION }}
