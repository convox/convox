name: lint
on: pull_request

jobs:
  telemetry-manifest-check:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: telemetry manifests match variables
        run: make lint-telemetry

  golangci-lint:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Install libudev-dev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # pinned: the action's "latest" can resolve to a go1.24-built v1 binary that rejects a
          # go 1.25 module. Bump this when go.mod's go version exceeds the linter's build go.
          version: v2.12.2
          args: --timeout 5m --new-from-rev=${{ github.event.pull_request.base.sha }}

  govulncheck:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Install libudev-dev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...

  terraform-lint:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: setup tflint
        uses: terraform-linters/setup-tflint@v4
      - name: init tflint
        run: tflint --init
      - name: terraform validate
        continue-on-error: true
        run: |
          for dir in $(find terraform -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u); do
            echo "==> terraform validate $dir"
            (cd "$dir" && terraform init -backend=false -input=false > /dev/null 2>&1 && terraform validate) || echo "  ⚠ validate failed for $dir (pre-existing)"
          done
      - name: tflint
        run: |
          for dir in $(find terraform -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u); do
            echo "==> tflint $dir"
            (cd "$dir" && tflint --config "$(git rev-parse --show-toplevel)/.tflint.hcl")
          done

  terraform-fleet-floor:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: terraform fleet floor
        run: |
          grep -vE '^[[:space:]]*(#|$)' .github/fleet-floor-patterns > "$RUNNER_TEMP/fleet-floor-patterns"
          if [ ! -s "$RUNNER_TEMP/fleet-floor-patterns" ]; then
            echo "no patterns loaded from .github/fleet-floor-patterns"
            exit 1
          fi
          set +e
          hits=$(grep -rnE --include='*.tf' --include='*.tpl' --include='*.sh' --exclude-dir=.terraform \
            -f "$RUNNER_TEMP/fleet-floor-patterns" terraform)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            printf '%s\n' "$hits"
            echo "Terraform construct above the fleet floor. A rack keeps the binary it was installed with, so terraform/ must stay parseable on the oldest binary in the fleet."
            exit 1
          fi
          if [ "$rc" -ne 1 ]; then
            echo "fleet floor scan failed: grep exited $rc"
            exit 1
          fi

  terraform-security:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install checkov
        run: pip install checkov
      - name: checkov
        run: checkov -d terraform --framework terraform --config-file .checkov.yml
