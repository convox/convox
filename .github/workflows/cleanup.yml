name: cleanup_aws_do

on:
  schedule:
    - cron:  '0 2/24 * * *'
  workflow_dispatch:

jobs:
  cleanup-aws:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        provider: [aws]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: AWS secrets
        run: ci/secrets.sh
        env:
          PROVIDER: aws
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: System dependencies
        run: ci/dependencies.sh
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Cache / download Go modules
        working-directory: ci
        run: go mod download
      - name: AWS cleanup
        working-directory: ci
        run: |
          go run .
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    us-east-1
  cleanup-do:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: do secrets
        run: ci/secrets.sh
        env:
          PROVIDER: do
          DIGITALOCEAN_ACCESS_ID: ${{ secrets.DIGITALOCEAN_ACCESS_ID }}
          DIGITALOCEAN_REGION: ${{ secrets.DIGITALOCEAN_REGION }}
          DIGITALOCEAN_SECRET_KEY: ${{ secrets.DIGITALOCEAN_SECRET_KEY }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      - name: dependencies
        run: ci/dependencies.sh
      - name: do cleanup
        run: ci/do_cleanup.sh
